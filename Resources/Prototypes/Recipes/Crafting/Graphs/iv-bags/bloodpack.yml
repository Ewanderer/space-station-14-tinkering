- type: constructionGraph
  id: IVBags
  start: start
  graph:
  - node: start
    edges:
    - to: empty
      steps:
      - tag: EmptyIVBag
        name: empty iv bag pack
        icon:
          sprite: Objects/Specific/Medical/medical.rsi
          state: bloodpack-empty
        doAfter: 0.1
      completed:
      - !type:PopupUser
        text: You drained the bags.
  - node: empty
    entity: EmptyIVBagPack
    edges:
    - to: done
      conditions:
      - !type:MinSolution
        solution: ivbag
        reagent:
          ReagentId: JuiceTomato
        quantity: 15
      - !type:MinSolution
        solution: ivbag
        reagent:
          ReagentId: Saline
        quantity: 45
      steps:
      - material: Steel
        amount: 1
        doAfter: 0.1
  - node: done
    entity: Bloodpack
